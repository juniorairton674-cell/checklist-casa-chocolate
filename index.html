<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação Estrutural por Loja — Casa do Chocolate</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3C2415">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist CdC">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap');

:root{
  --cacau: #3C2415;
  --cacau-2: #5B3A24;
  --rosa: #E85D8A;
  --rosa-2: #F58FB0;
  --creme: #FFF8F0;
  --creme-2: #FBEEDF;
  --ouro: #C9A15A;
  --verde: #3E9B5C;
  --vermelho: #D14343;
  --linha: #E8D9C8;
  --texto: #3C2415;
  --texto-suave: #8A6F5C;
  --sombra: 0 4px 16px rgba(60,36,21,.08);
  --sombra-forte: 0 8px 28px rgba(60,36,21,.16);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background: var(--creme);
  color: var(--texto);
  font-family:'Outfit', sans-serif;
  padding-bottom: 60px;
}

h1,h2,h3, .marca{ font-family:'Baloo 2', cursive; }

/* ---------- HEADER ---------- */
.topo{
  background: linear-gradient(135deg, var(--cacau) 0%, var(--cacau-2) 100%);
  color: var(--creme);
  padding: 24px 20px 90px;
  position: relative;
  overflow:hidden;
}
.topo::after{
  content:"";
  position:absolute; right:-60px; top:-60px;
  width:220px; height:220px; border-radius:50%;
  background: radial-gradient(circle, rgba(232,93,138,.35), transparent 70%);
}
.topo-conteudo{
  display:flex; align-items:center; gap:16px;
  max-width: 960px; margin:0 auto;
  position:relative; z-index:1;
}
.topo-logo{
  width:76px; height:auto; flex:0 0 auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.25));
}
.marca{
  font-size: 15px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color: var(--rosa-2);
  font-weight:600;
  margin:0 0 6px;
}
.topo h1{
  margin:0;
  font-size: clamp(22px, 4vw, 32px);
  font-weight:800;
  line-height:1.15;
  max-width: 640px;
}
.topo p.sub{
  margin:8px 0 0;
  color: var(--creme-2);
  opacity:.85;
  font-size:14px;
}

/* ---------- CARD (dados gerais) floating over header ---------- */
.dados-card{
  max-width: 960px;
  margin: -60px auto 0;
  background: #fff;
  border-radius: 18px;
  box-shadow: var(--sombra-forte);
  padding: 22px 24px;
  position:relative;
  z-index:2;
}
.dados-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:18px;
}
@media (max-width:640px){ .dados-grid{ grid-template-columns:1fr; } }

.campo label{
  display:block;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  color: var(--texto-suave);
  margin-bottom:6px;
}
.campo input[type=text], .campo input[type=date]{
  width:100%;
  border:1.5px solid var(--linha);
  border-radius:10px;
  padding:10px 12px;
  font-family:'Outfit',sans-serif;
  font-size:14px;
  color: var(--texto);
  background: var(--creme);
}
.campo input:focus{ outline:2px solid var(--rosa); outline-offset:1px; }

.lojas{
  display:flex; flex-wrap:wrap; gap:8px;
}
.loja-btn{
  border:1.5px solid var(--linha);
  background: var(--creme);
  border-radius: 999px;
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  color: var(--texto-suave);
  transition:.15s;
}
.loja-btn.ativo{
  background: var(--rosa);
  border-color: var(--rosa);
  color:#fff;
}

/* ---------- RESUMO STICKY ---------- */
.resumo-bar{
  position: sticky; top:0; z-index: 50;
  background: #fff;
  border-bottom: 1px solid var(--linha);
  box-shadow: 0 2px 10px rgba(60,36,21,.06);
}
.resumo-inner{
  max-width: 960px; margin:0 auto;
  display:flex; align-items:center; gap:16px;
  padding: 10px 20px;
}
.selo{
  width:56px; height:56px; border-radius:50%;
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  font-family:'Baloo 2',cursive; font-weight:800; font-size:14px;
  color:#fff;
  background: conic-gradient(var(--rosa) calc(var(--pct,0)*1%), var(--linha) 0);
  position:relative;
}
.selo::before{
  content:"";
  position:absolute; inset:5px;
  border-radius:50%;
  background:#fff;
}
.selo span{ position:relative; z-index:1; color: var(--cacau); font-size:13px; }
.resumo-texto{ flex:1; min-width:0; }
.resumo-texto .pct{ font-family:'Baloo 2',cursive; font-size:20px; font-weight:800; line-height:1.1; }
.resumo-texto .status{
  display:inline-block; margin-top:2px;
  font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 10px; border-radius:999px;
}
.status.aprovada{ background:rgba(62,155,92,.14); color:var(--verde); }
.status.reprovada{ background:rgba(209,67,67,.12); color:var(--vermelho); }
.resumo-acoes{ display:flex; gap:8px; }
.btn{
  border:none; border-radius:10px; padding:9px 14px;
  font-family:'Outfit',sans-serif; font-weight:600; font-size:13px;
  cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  transition:.15s;
}
.btn-rosa{ background:var(--rosa); color:#fff; }
.btn-rosa:hover{ background:#d94d7c; }
.btn-outline{ background:#fff; border:1.5px solid var(--linha); color:var(--texto); }
.btn-outline:hover{ border-color:var(--rosa); color:var(--rosa); }
.btn-ghost{ background:transparent; color:var(--texto-suave); text-decoration:underline; padding:4px; }

@media (max-width:640px){
  .resumo-acoes .txt{ display:none; }
}

/* ---------- ABAS DE CATEGORIA ---------- */
.abas-bar{
  position: sticky; top: 61px; z-index: 40;
  background: var(--creme-2);
  border-bottom: 1px solid var(--linha);
}
.abas-inner{
  max-width: 960px; margin:0 auto;
  display:flex; gap:8px;
  padding: 10px 20px;
  overflow-x:auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.aba-btn{
  flex:0 0 auto;
  border:1.5px solid var(--linha);
  background:#fff;
  color: var(--texto-suave);
  border-radius: 999px;
  padding: 8px 15px;
  font-family:'Outfit',sans-serif;
  font-size:13px; font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  display:flex; align-items:center; gap:7px;
  transition:.15s;
}
.aba-btn:hover{ border-color:var(--rosa-2); }
.aba-btn.ativa{
  background: var(--rosa);
  border-color: var(--rosa);
  color:#fff;
}
.aba-badge{
  font-size:10.5px; font-weight:700;
  background: rgba(0,0,0,.12);
  padding: 1px 6px; border-radius:999px;
}
.aba-btn.ativa .aba-badge{ background: rgba(255,255,255,.28); }
.aba-btn.resumo-tab{ border-color: var(--ouro); color: var(--cacau); font-weight:700; }
.aba-btn.resumo-tab.ativa{ background: var(--cacau); border-color: var(--cacau); color:#fff; }

/* ---------- CONTEÚDO ---------- */
.conteudo{ max-width: 960px; margin: 28px auto; padding: 0 20px; }
.voltar-topo{
  display:inline-flex; align-items:center; gap:6px;
  background:none; border:none; color:var(--texto-suave);
  font-size:12.5px; font-weight:600; cursor:pointer; margin-bottom:14px; padding:0;
}
.voltar-topo:hover{ color:var(--rosa); }

.categoria{
  background:#fff;
  border-radius:16px;
  box-shadow: var(--sombra);
  margin-bottom:22px;
  overflow:hidden;
}
.cat-cab{
  padding:16px 20px;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
  border-bottom: 1px solid var(--linha);
  background: var(--creme-2);
}
.cat-cab h2{
  margin:0; font-size:17px; font-weight:700; color:var(--cacau);
}
.cat-total{
  font-size:13px; font-weight:700; color:var(--texto-suave);
  white-space:nowrap;
}
.cat-total b{ color:var(--rosa); }

.item{
  padding:16px 20px;
  border-bottom:1px solid var(--linha);
  display:grid;
  grid-template-columns: 1fr 110px;
  gap: 10px 16px;
  align-items:start;
}
.item:last-child{ border-bottom:none; }
.item-pergunta{
  font-size:14.5px; line-height:1.45;
  padding-top:6px;
}
.item-nota{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
.item-nota input{
  width:70px; text-align:center;
  border:1.5px solid var(--linha); border-radius:10px;
  padding:8px 4px; font-size:16px; font-weight:700;
  color: var(--cacau); font-family:'Outfit',sans-serif;
}
.item-nota input:focus{ outline:2px solid var(--rosa); border-color:var(--rosa); }
.item-nota small{ color:var(--texto-suave); font-size:10px; }

.item-extra{ grid-column: 1 / -1; display:flex; flex-direction:column; gap:10px; }
.item-extra textarea{
  width:100%; min-height:44px; resize:vertical;
  border:1.5px solid var(--linha); border-radius:10px;
  padding:9px 12px; font-family:'Outfit',sans-serif; font-size:13.5px;
  color:var(--texto); background:var(--creme);
}
.item-extra textarea:focus{ outline:2px solid var(--rosa); }
.item-extra textarea::placeholder{ color:#B9A691; }

.fotos-row{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.foto-thumb{
  width:64px; height:64px; border-radius:10px; overflow:hidden;
  position:relative; flex:0 0 auto; border:1px solid var(--linha);
}
.foto-thumb img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
.foto-thumb .rm{
  position:absolute; top:2px; right:2px;
  width:18px; height:18px; border-radius:50%;
  background:rgba(60,36,21,.75); color:#fff;
  border:none; font-size:11px; line-height:18px; text-align:center;
  cursor:pointer; padding:0;
}
.add-foto{
  width:64px; height:64px; border-radius:10px;
  border:1.5px dashed var(--linha);
  background:var(--creme);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; color:var(--texto-suave); font-size:10px; gap:2px;
  flex:0 0 auto;
}
.add-foto:hover{ border-color:var(--rosa); color:var(--rosa); }
.add-foto svg{ width:18px; height:18px; }
.add-foto input{ display:none; }

/* ---------- RODAPÉ FINAL ---------- */
.final-card{
  background: linear-gradient(135deg, var(--cacau), var(--cacau-2));
  color:#fff;
  border-radius:18px;
  padding: 26px 24px;
  text-align:center;
  box-shadow: var(--sombra-forte);
}
.final-card .pct-grande{
  font-family:'Baloo 2',cursive; font-weight:800;
  font-size: 52px; line-height:1;
}
.final-card .selo-status{
  display:inline-block; margin-top:10px;
  padding:6px 20px; border-radius:999px;
  font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:13px;
}
.selo-status.aprovada{ background:rgba(62,155,92,.25); color:#8ee6a8; }
.selo-status.reprovada{ background:rgba(209,67,67,.25); color:#ff9d9d; }
.final-card .meta{ margin-top:12px; font-size:12.5px; color:var(--creme-2); opacity:.8; }

/* lightbox */
.lightbox{
  position:fixed; inset:0; background:rgba(20,10,5,.85);
  display:none; align-items:center; justify-content:center; z-index:100; padding:24px;
}
.lightbox.aberto{ display:flex; }
.lightbox img{ max-width:100%; max-height:100%; border-radius:10px; }
.lightbox-close{
  position:absolute; top:20px; right:20px;
  background:#fff; border:none; border-radius:50%;
  width:36px; height:36px; font-size:18px; cursor:pointer;
}

/* toast */
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background: var(--cacau); color:#fff; padding:10px 18px;
  border-radius:10px; font-size:13px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s;
  z-index:200;
}
.toast.mostrar{ opacity:1; transform:translateX(-50%) translateY(-6px); }

input[type=file]{ display:none; }

/* ---------- PRINT ---------- */
.impressao{ display:none; }
.impressao .foto-impressao{
  display:inline-block; width:170px; margin:0 8px 8px 0; vertical-align:top;
}
.impressao .foto-impressao img{
  width:170px; height:170px; object-fit:cover; border-radius:8px; border:1px solid var(--linha); display:block;
}
@media print{
  body{ background:#fff; }
  .resumo-bar{ display:none !important; }
  .abas-bar{ display:none !important; }
  .voltar-topo{ display:none !important; }
  .btn-rosa, .btn-outline{ display:none !important; }
  .add-foto{ display:none !important; }
  .conteudo{ display:none !important; }
  .categoria{ display:block !important; box-shadow:none; border:1px solid var(--linha); break-inside: avoid; }
  .item{ break-inside: avoid; }
  .topo::after{ display:none; }
  .dados-card{ box-shadow:none; border:1px solid var(--linha); }
  .impressao{ display:block !important; max-width:960px; margin:24px auto; padding:0 20px; }
}
</style>
</head>

const CHAVE_LOCAL = "checklistCasaChocolate_v1";

let estado = { loja:"", acompanhou:"", data:"", auditor:"", categorias:[] };
let abaAtiva = 0; // índice da categoria ativa, ou "resumo"

function estadoInicial(){
  estado.categorias = DADOS.map(cat => ({
    nome: cat.nome,
    itens: cat.itens.map(txt => ({ texto: txt, nota:"", comentario:"", fotos:[] }))
  }));
}

function salvarLocal(){
  try{
    coletarEstado();
    localStorage.setItem(CHAVE_LOCAL, JSON.stringify(estado));
  }catch(err){
    // armazenamento cheio ou indisponível — ignora silenciosamente
  }
}

function carregarLocal(){
  try{
    const salvo = localStorage.getItem(CHAVE_LOCAL);
    if(!salvo) return false;
    const dados = JSON.parse(salvo);
    if(!dados || !Array.isArray(dados.categorias) || dados.categorias.length !== DADOS.length) return false;
    estado = dados;
    return true;
  }catch(err){
    return false;
  }
}

function limparTudo(){
  if(!confirm("Isso vai apagar todas as notas, comentários e fotos preenchidos nesta auditoria. Deseja continuar?")) return;
  try{ localStorage.removeItem(CHAVE_LOCAL); }catch(err){}
  estado = { loja:"", acompanhou:"", data:"", auditor:"", categorias:[] };
  estadoInicial();
  abaAtiva = 0;
  $('acompanhou').value = "";
  $('auditor').value = "";
  $('dataAplicacao').valueAsDate = new Date();
  estado.data = $('dataAplicacao').value;
  renderLojas();
  renderAbas();
  renderConteudo();
  atualizarResumo();
  mostrarToast("Tudo limpo — começando do zero ✓");
}

if(!carregarLocal()){
  estadoInicial();
}

const $ = id => document.getElementById(id);

    const b = document.createElement('button');
    b.type="button";
    b.className="loja-btn" + (estado.loja===nome ? " ativo":"");
    b.textContent = nome;
    b.onclick = ()=>{ estado.loja = nome; renderLojas(); salvarLocal(); };
    box.appendChild(b);
  });
}

function renderAbas(){
  const box = $('abas');
  box.innerHTML = "";
  estado.categorias.forEach((cat, ci)=>{
    const {obtido, possivel} = totalCategoria(cat);
    const pct = possivel ? Math.round(obtido/possivel*100) : 0;
    const b = document.createElement('button');
    b.className = "aba-btn" + (abaAtiva===ci ? " ativa":"");
    b.innerHTML = `${cat.nome} <span class="aba-badge">${pct}%</span>`;
    b.onclick = ()=>{ abaAtiva = ci; renderAbas(); renderConteudo(); window.scrollTo({top:0, behavior:'smooth'}); };
    box.appendChild(b);
  });
  const rb = document.createElement('button');
  rb.className = "aba-btn resumo-tab" + (abaAtiva==='resumo' ? " ativa":"");
  rb.innerHTML = `📊 Resumo Final`;
  rb.onclick = ()=>{ abaAtiva = 'resumo'; renderAbas(); renderConteudo(); window.scrollTo({top:0, behavior:'smooth'}); };
  box.appendChild(rb);
}

function renderConteudo(){
  const box = $('conteudo');
  box.innerHTML = "";

  if(abaAtiva === 'resumo'){
    renderResumoFinal(box);
    return;
  }

  const cat = estado.categorias[abaAtiva];
  const {obtido, possivel} = totalCategoria(cat);
  const pct = possivel ? (obtido/possivel*100) : 0;

  const card = document.createElement('div');
  card.className = "categoria";

  const cab = document.createElement('div');
  cab.className = "cat-cab";
  cab.innerHTML = `<h2>${cat.nome}</h2><div class="cat-total">${obtido} / ${possivel} pts &nbsp;·&nbsp; <b>${pct.toFixed(1).replace('.',',')}%</b></div>`;
  card.appendChild(cab);

  cat.itens.forEach((item, ii)=>{
    const row = document.createElement('div');
    row.className = "item";

    const pergunta = document.createElement('div');
    pergunta.className = "item-pergunta";
    pergunta.textContent = item.texto;
    row.appendChild(pergunta);

    const notaBox = document.createElement('div');
    notaBox.className = "item-nota";
    notaBox.innerHTML = `
      <input type="number" min="1" max="10" step="1" placeholder="—" value="${item.nota}">
      <small>nota 1 a 10</small>`;
    const notaInput = notaBox.querySelector('input');
    notaInput.oninput = (e)=>{
      let v = e.target.value;
      if(v!==""){ v = Math.max(1, Math.min(10, Math.round(Number(v)))); e.target.value=v; }
      item.nota = v;
      atualizarTudo();
    };
    row.appendChild(notaBox);

    const extra = document.createElement('div');
    extra.className = "item-extra";

    const coment = document.createElement('textarea');
    coment.placeholder = "Comentário (opcional)";
    coment.value = item.comentario;
    coment.oninput = (e)=>{ item.comentario = e.target.value; salvarLocal(); };
    extra.appendChild(coment);

    const fotosRow = document.createElement('div');
    fotosRow.className = "fotos-row";
    renderFotos(fotosRow, item);
    extra.appendChild(fotosRow);

    row.appendChild(extra);
    card.appendChild(row);
  });

  box.appendChild(card);
}

function renderResumoFinal(box){
  const {obtido, possivel} = totalGeral();
  const pct = possivel ? (obtido/possivel*100) : 0;
  const pctStr = pct.toFixed(1).replace('.',',') + '%';
  const aprovada = pct >= 95;

  const lista = document.createElement('div');
  lista.className = "categoria";
  estado.categorias.forEach((cat, ci)=>{
    const t = totalCategoria(cat);
    const p = t.possivel ? (t.obtido/t.possivel*100) : 0;
    const row = document.createElement('div');
    row.className = "item";
    row.style.gridTemplateColumns = "1fr auto";
    row.innerHTML = `
      <div class="item-pergunta" style="padding-top:0; font-weight:600; cursor:pointer;">${cat.nome}</div>
      <div style="font-weight:700; color:var(--rosa); white-space:nowrap;">${t.obtido}/${t.possivel} · ${p.toFixed(1).replace('.',',')}%</div>`;
    row.querySelector('.item-pergunta').onclick = ()=>{ abaAtiva = ci; renderAbas(); renderConteudo(); window.scrollTo({top:0, behavior:'smooth'}); };
    lista.appendChild(row);
  });
  box.appendChild(lista);

  const final = document.createElement('div');
  final.className = "final-card";
  final.innerHTML = `
    <div style="font-size:12px; letter-spacing:.1em; text-transform:uppercase; opacity:.75;">Resultado Final</div>
    <div class="pct-grande">${pctStr}</div>
    <div class="selo-status ${aprovada?'aprovada':'reprovada'}">${aprovada?'✓ Loja Aprovada':'✕ Loja Reprovada'}</div>
    <div class="meta">${obtido} de ${possivel} pontos obtidos · aprovação a partir de 95%</div>`;
  box.appendChild(final);
}

function renderFotos(container, item){
  container.innerHTML = "";
  item.fotos.forEach((src, fi)=>{
    const t = document.createElement('div');
    t.className = "foto-thumb";
    t.innerHTML = `<img src="${src}"><button class="rm" title="Remover">✕</button>`;
    t.querySelector('img').onclick = ()=> abrirLightbox(src);
    t.querySelector('.rm').onclick = ()=>{
      item.fotos.splice(fi,1);
      renderFotos(container, item);
      salvarLocal();
    };
    container.appendChild(t);
  });
  const add = document.createElement('label');
  add.className = "add-foto";
  add.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Foto
    <input type="file" accept="image/*" multiple capture="environment">`;
  add.querySelector('input').onchange = (e)=>{
    const files = Array.from(e.target.files);
    let pendentes = files.length;
    if(!pendentes) return;
    files.forEach(f=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        item.fotos.push(reader.result);
        pendentes--;
        if(pendentes===0){ renderFotos(container, item); salvarLocal(); }
      };
      reader.readAsDataURL(f);
    });
  };
  container.appendChild(add);
}

function totalCategoria(cat){
  let obtido=0, possivel=0;
  cat.itens.forEach(it=>{
    possivel += 10;
    obtido += (it.nota!=="" && !isNaN(Number(it.nota))) ? Number(it.nota) : 0;
  });
  return {obtido, possivel};
}

function totalGeral(){
  let obtido=0, possivel=0;
  estado.categorias.forEach(cat=>{
    const t = totalCategoria(cat);
    obtido += t.obtido; possivel += t.possivel;
  });
  return {obtido, possivel};
}

function atualizarResumo(){
  const {obtido, possivel} = totalGeral();
  const pct = possivel ? (obtido/possivel*100) : 0;
  const pctStr = pct.toFixed(1).replace('.',',') + '%';
  const aprovada = pct >= 95;

  $('selo').style.setProperty('--pct', pct.toFixed(1));
  $('seloPct').textContent = Math.round(pct) + '%';
  $('resumoPct').textContent = pctStr;
  const st = $('resumoStatus');
  st.textContent = aprovada ? "Aprovada" : "Reprovada";
  st.className = "status " + (aprovada ? "aprovada":"reprovada");
}

function atualizarTudo(){
  // atualiza só o cabeçalho da categoria ativa (sem redesenhar os inputs, pra não perder o foco)
  if(abaAtiva !== 'resumo'){
    const cat = estado.categorias[abaAtiva];
    const {obtido, possivel} = totalCategoria(cat);
    const pct = possivel ? (obtido/possivel*100) : 0;
    const totalEl = document.querySelector('.categoria .cat-total');
    if(totalEl) totalEl.innerHTML = `${obtido} / ${possivel} pts &nbsp;·&nbsp; <b>${pct.toFixed(1).replace('.',',')}%</b>`;
  }
  renderAbas();
  atualizarResumo();
  salvarLocal();
}

function abrirLightbox(src){
  $('lightboxImg').src = src;
  $('lightbox').classList.add('aberto');
}
function fecharLightbox(){
  $('lightbox').classList.remove('aberto');
}
$('lightbox').onclick = (e)=>{ if(e.target.id==='lightbox') fecharLightbox(); };

function mostrarToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('mostrar');
  setTimeout(()=>t.classList.remove('mostrar'), 2200);
}

function coletarEstado(){
  estado.acompanhou = $('acompanhou').value;
  estado.data = $('dataAplicacao').value;
  estado.auditor = $('auditor').value;
  return estado;
}

function exportarJSON(){
  coletarEstado();
  const blob = new Blob([JSON.stringify(estado, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const lojaSlug = (estado.loja||"loja").toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const dataSlug = estado.data || new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `auditoria-${lojaSlug}-${dataSlug}.json`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast("Progresso salvo em arquivo ✓");
}

function importarJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const dados = JSON.parse(reader.result);
      estado = dados;
      $('acompanhou').value = estado.acompanhou||"";
      $('dataAplicacao').value = estado.data||"";
      $('auditor').value = estado.auditor||"";
      abaAtiva = 0;
      renderLojas();
      renderAbas();
      renderConteudo();
      atualizarResumo();
      salvarLocal();
      mostrarToast("Auditoria carregada ✓");
    }catch(err){
      mostrarToast("Arquivo inválido");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function montarImpressao(){
  coletarEstado();
  const box = $('impressao');
  const {obtido, possivel} = totalGeral();
  const pct = possivel ? (obtido/possivel*100) : 0;
  const pctStr = pct.toFixed(1).replace('.',',') + '%';
  const aprovada = pct >= 95;

  let html = `
    <div style="margin-bottom:18px;">
      <p class="marca" style="color:var(--rosa);">Casa do Chocolate</p>
      <h1 style="margin:0 0 4px;">Avaliação Estrutural por Loja</h1>
      <p style="margin:0; color:var(--texto-suave); font-size:13.5px;">
        Loja: <b>${estado.loja || "—"}</b> &nbsp;·&nbsp;
        Data: <b>${estado.data || "—"}</b> &nbsp;·&nbsp;
        Acompanhou: <b>${estado.acompanhou || "—"}</b> &nbsp;·&nbsp;
        Auditor(a): <b>${estado.auditor || "—"}</b>
      </p>
    </div>`;

  estado.categorias.forEach(cat=>{
    const t = totalCategoria(cat);
    const p = t.possivel ? (t.obtido/t.possivel*100) : 0;
    html += `<div class="categoria" style="margin-bottom:18px;">
      <div class="cat-cab"><h2>${cat.nome}</h2><div class="cat-total">${t.obtido} / ${t.possivel} pts &nbsp;·&nbsp; <b>${p.toFixed(1).replace('.',',')}%</b></div></div>`;
    cat.itens.forEach(item=>{
      html += `<div class="item" style="grid-template-columns:1fr 90px;">
        <div class="item-pergunta">${item.texto}</div>
        <div class="item-nota"><input type="text" value="${item.nota!==""?item.nota:"—"}" readonly><small>nota 1 a 10</small></div>
        <div class="item-extra">`;
      if(item.comentario){
        html += `<div style="font-size:13px; color:var(--texto-suave);"><b>Comentário:</b> ${item.comentario}</div>`;
      }
      if(item.fotos && item.fotos.length){
        html += `<div>`;
        item.fotos.forEach(src=>{
          html += `<span class="foto-impressao"><img src="${src}"></span>`;
        });
        html += `</div>`;
      }
      html += `</div></div>`;
    });
    html += `</div>`;
  });

  html += `<div class="final-card">
      <div style="font-size:12px; letter-spacing:.1em; text-transform:uppercase; opacity:.75;">Resultado Final</div>
      <div class="pct-grande">${pctStr}</div>
      <div class="selo-status ${aprovada?'aprovada':'reprovada'}">${aprovada?'✓ Loja Aprovada':'✕ Loja Reprovada'}</div>
      <div class="meta">${obtido} de ${possivel} pontos obtidos · aprovação a partir de 95%</div>
    </div>`;

  box.innerHTML = html;
}

function imprimirRelatorio(){
  montarImpressao();
  setTimeout(()=> window.print(), 50);
}

// init
$('acompanhou').value = estado.acompanhou || "";
$('auditor').value = estado.auditor || "";
if(estado.data){
  $('dataAplicacao').value = estado.data;
}else{
  $('dataAplicacao').valueAsDate = new Date();
  estado.data = $('dataAplicacao').value;
}

$('acompanhou').oninput = ()=>{ estado.acompanhou = $('acompanhou').value; salvarLocal(); };
$('auditor').oninput = ()=>{ estado.auditor = $('auditor').value; salvarLocal(); };
$('dataAplicacao').oninput = ()=>{ estado.data = $('dataAplicacao').value; salvarLocal(); };

renderLojas();
renderAbas();
renderConteudo();
atualizarResumo();

window.addEventListener('beforeprint', montarImpressao);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>

</body>
</html>
